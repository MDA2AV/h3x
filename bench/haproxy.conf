# HAProxy HTTP/3 server for benchmarking - mirrors bench/h2o.conf and bench/nginx.conf: serves the
# same 20KB static file directly (no backend hop) over HTTP/3 (QUIC) on :14435, 4 threads, no access
# logging. Uses HAProxy's own QUIC stack (a third stack next to h2o's quicly and nginx's OpenSSL-QUIC).
global
    nbthread 12
    maxconn 200000
    # http-request return loads the whole file into one buffer, so this must exceed the largest
    # payload we serve (128 KB) plus its headers. At 32768 the 128 KB object silently fails.
    tune.bufsize 262144

defaults
    mode http
    timeout client 30s
    timeout connect 5s
    timeout server 30s

frontend h3
    bind quic4@0.0.0.0:14435 ssl crt /etc/haproxy/certs/haproxy.pem alpn h3
    bind 0.0.0.0:14435 ssl crt /etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
    # Serve straight from HAProxy so we measure its h3 server, not a proxied backend. One rule per
    # payload, keyed on the path, because h2o and nginx resolve the path against doc_root themselves
    # and haproxy cannot: without these it would answer every path with the 1 KB file and the grid
    # would record 128 KB numbers that were really 1 KB ones. That exact failure (a 20 KB object
    # measured against 1 KB tables) already invalidated one round of sweeps here.
    http-request return status 200 content-type "text/html" file /doc_root/20k.html if { path /20k.html }
    http-request return status 200 content-type "text/html" file /doc_root/128k.html if { path /128k.html }
    http-request return status 200 content-type "text/html" file /doc_root/index.html
